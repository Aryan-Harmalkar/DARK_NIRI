[package]
name = "dark-tools-rs"
version = "0.1.0"
edition = "2021"
authors = ["Aryan"]
description = "High-performance native Rust system utilities for DARK_NIRI dotfiles"

[dependencies]
gtk4 = "0.9"
gtk4-layer-shell = "0.4"
webkit6 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[[bin]]
name = "net-tracker"
path = "src/bin/net_tracker.rs"

[[bin]]
name = "daily-network-logger"
path = "src/bin/daily_network_logger.rs"

[[bin]]
name = "wifi"
path = "src/bin/wifi.rs"

[[bin]]
name = "bluetooth"
path = "src/bin/bluetooth.rs"

[[bin]]
name = "notifications"
path = "src/bin/notifications.rs"

[[bin]]
name = "wp-ipc"
path = "src/bin/wallpaper_ipc.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[[bin]]
name = "wallpaper-engine"
path = "src/bin/wallpaper_engine.rs"

[[bin]]
name = "theme-manager"
path = "src/bin/theme_manager.rs"
