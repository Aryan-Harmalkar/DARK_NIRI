<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a2a; font-family: monospace; }
    #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 40px;
      color: #00ffff; text-shadow: 0 0 10px #00ffff;
    }
    .top-bar { display: flex; justify-content: space-between; font-size: 1.2rem; }
    .bottom-bar { text-align: right; }
    h1 { font-size: 3rem; letter-spacing: 2px; margin-bottom: 10px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    .status-glitch { animation: glitch 2s linear infinite; }
    @keyframes glitch {
      2%, 64% { transform: translate(2px,0) skew(0deg); }
      4%, 60% { transform: translate(-2px,0) skew(0deg); }
      62% { transform: translate(0,0) skew(5deg); }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="ui-layer">
    <div class="top-bar">
      <div>SYS.OP // NEO-TOKYO</div>
      <div id="sys-time">00:00:00</div>
    </div>
    <div class="bottom-bar">
      <h1 class="status-glitch">NIGHT CITY</h1>
      <div>RAIN OVERRIDE: ACTIVE</div>
    </div>
  </div>

  <script src="../shared/lib/three.min.js"></script>
  <script src="../shared/lib/anime.min.js"></script>
  <script src="../shared/engine-core.js"></script>
  <script src="theme.js"></script>
</body>
</html>
