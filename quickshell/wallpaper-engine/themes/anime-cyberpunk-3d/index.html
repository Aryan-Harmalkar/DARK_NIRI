<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anime Cyberpunk City 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #020108; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="lib/three.min.js"></script>
  <script src="lib/anime.min.js"></script>

  <script>
    let scene, camera, renderer;
    let animationId = null, lastRenderTime = 0;
    const CONFIG = { targetFPS: 60, quality: 'high', mouseParallax: true };
    let isContextLost = false;

    // --- ELEMENTS ---
    let rainParticles, cityGroup, glowingSigns = [];
    
    function init() {
      const container = document.getElementById('container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a0514, 0.015);
      scene.background = new THREE.Color(0x0a0514);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 20, 80);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      renderer.domElement.addEventListener("webglcontextlost", (e) => { e.preventDefault(); isContextLost = true; cancelAnimationFrame(animationId); }, false);
      renderer.domElement.addEventListener("webglcontextrestored", () => { isContextLost = false; initSceneContent(); renderLoop(performance.now()); }, false);

      initSceneContent();
      setupBridge();
      setupEvents();
      renderLoop(performance.now());
    }

    function initSceneContent() {
      while(scene.children.length > 0) { scene.remove(scene.children[0]); }
      
      // LIGHTING
      const ambientLight = new THREE.AmbientLight(0x111122, 1);
      scene.add(ambientLight);
      
      const neonPink = new THREE.PointLight(0xff2a6d, 2, 100);
      neonPink.position.set(-20, 10, -20);
      scene.add(neonPink);
      
      const neonCyan = new THREE.PointLight(0x01ffc3, 2, 100);
      neonCyan.position.set(20, 15, -10);
      scene.add(neonCyan);

      // GROUND (Reflective stylized street)
      const groundGeo = new THREE.PlaneGeometry(300, 300);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // CITYSCAPE (Procedural Buildings)
      cityGroup = new THREE.Group();
      const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
      
      // We will create buildings and glowing signs
      for(let i=0; i<60; i++) {
        const h = Math.random() * 40 + 10;
        const w = Math.random() * 8 + 5;
        const d = Math.random() * 8 + 5;
        
        const bMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.8 });
        const building = new THREE.Mesh(buildingGeo, bMat);
        building.scale.set(w, h, d);
        
        // Random placement avoiding center street
        let px = (Math.random() - 0.5) * 150;
        if(Math.abs(px) < 15) px = px > 0 ? px + 15 : px - 15;
        const pz = -Math.random() * 150;
        
        building.position.set(px, h/2, pz);
        cityGroup.add(building);

        // Add neon signs to some buildings
        if(Math.random() > 0.6) {
          const signGeo = new THREE.PlaneGeometry(w * 0.8, h * 0.2);
          const colors = [0xff2a6d, 0x01ffc3, 0xf9c80e];
          const c = colors[Math.floor(Math.random() * colors.length)];
          const signMat = new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
          const sign = new THREE.Mesh(signGeo, signMat);
          sign.position.set(px, h * 0.8, pz + (d/2 + 0.1));
          cityGroup.add(sign);
          glowingSigns.push(sign);
        }
      }
      scene.add(cityGroup);

      // Pulse neon signs with Anime.js
      glowingSigns.forEach(sign => {
        anime({
          targets: sign.material,
          opacity: [0.3, 1],
          duration: 100 + Math.random() * 2000,
          direction: 'alternate',
          loop: true,
          easing: 'steps(3)'
        });
      });

      // DIGITAL RAIN
      const rainCount = 1500;
      const rainGeo = new THREE.BufferGeometry();
      const rainPos = new Float32Array(rainCount * 3);
      for(let i=0; i<rainCount*3; i+=3) {
        rainPos[i] = (Math.random() - 0.5) * 200;
        rainPos[i+1] = Math.random() * 100;
        rainPos[i+2] = (Math.random() - 0.5) * 100 - 20;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
      
      const rainMat = new THREE.PointsMaterial({ color: 0x01ffc3, size: 0.2, transparent: true, opacity: 0.6 });
      rainParticles = new THREE.Points(rainGeo, rainMat);
      scene.add(rainParticles);
    }

    // --- RENDER LOOP ---
    let targetMouseX = 0, targetMouseY = 0;
    
    function renderLoop(time) {
      if (isContextLost) return;
      animationId = requestAnimationFrame(renderLoop);
      if (window.__isWallpaperObscured) return;

      const timeSinceLastRender = time - lastRenderTime;
      const frameInterval = 1000 / CONFIG.targetFPS;
      if (timeSinceLastRender < frameInterval) return;
      lastRenderTime = time - (timeSinceLastRender % frameInterval);

      // Rain fall logic
      if (rainParticles) {
        const positions = rainParticles.geometry.attributes.position.array;
        for(let i=0; i<1500; i++) {
          positions[i*3+1] -= 1.5; // fall speed
          if(positions[i*3+1] < 0) {
            positions[i*3+1] = 100;
          }
        }
        rainParticles.geometry.attributes.position.needsUpdate = true;
      }

      // Mouse Parallax
      if (CONFIG.mouseParallax && !window.__isWallpaperObscured) {
        camera.position.x += (targetMouseX - camera.position.x) * 0.05;
        camera.position.y += ((20 + targetMouseY) - camera.position.y) * 0.05;
        camera.lookAt(0, 10, -50);
      }

      renderer.render(scene, camera);
    }

    function setupEvents() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      document.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth * 2 - 1) * 8;
        targetMouseY = -(e.clientY / window.innerHeight * 2 - 1) * 5;
      });
      window.addEventListener("unload", disposeResources);
    }

    function setupBridge() {
      if (!window.wallpaper) return;
      window.wallpaper.on('battery', (data) => {
        if (!data.charging && data.percentage < 30) {
          CONFIG.targetFPS = 30; renderer.setPixelRatio(1);
        } else {
          CONFIG.targetFPS = 60; renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
      });
    }

    function disposeResources() {
      cancelAnimationFrame(animationId);
      anime.remove('*');
      if (!scene) return;
      scene.traverse((object) => {
        if (!object.isMesh) return;
        if (object.geometry) object.geometry.dispose();
        if (object.material) {
          if (Array.isArray(object.material)) object.material.forEach(m => m.dispose());
          else object.material.dispose();
        }
      });
      if (renderer) { renderer.dispose(); renderer.forceContextLoss(); }
    }

    init();
  </script>
</body>
</html>
