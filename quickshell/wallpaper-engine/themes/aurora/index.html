<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; overflow: hidden; }
    body { background: #0c0d14; width: 100vw; height: 100vh; }
    canvas { width: 100%; height: 100%; display: block; filter: blur(24px); opacity: 0.88; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let t = 0;
    function draw() {
      t += 0.008;
      ctx.fillStyle = '#0c0d14';
      ctx.fillRect(0, 0, w, h);

      const colors = [
        ['#7aa2f7', 0.25],
        ['#bb9af7', 0.22],
        ['#7dcfff', 0.28],
        ['#9ece6a', 0.20]
      ];

      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const baseH = h * (0.35 + i * 0.14);
        ctx.moveTo(0, h);
        for (let x = 0; x <= w; x += 15) {
          const y = baseH + Math.sin(x * 0.003 + t * (1.2 + i * 0.3)) * 90 + Math.cos(x * 0.002 - t * 0.8) * 60;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, baseH - 120, 0, h);
        grad.addColorStop(0, colors[i][0]);
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.globalAlpha = colors[i][1];
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
