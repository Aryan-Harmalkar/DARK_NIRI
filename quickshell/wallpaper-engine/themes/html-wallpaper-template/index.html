<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Wallpaper Template</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
  </style>
</head>
<body>
  <div id="container"></div>

  <!-- Local Libraries -->
  <script src="lib/three.min.js"></script>
  <script src="lib/anime.min.js"></script>

  <script>
    /**
     * THREE.JS + ANIME.JS WALLPAPER TEMPLATE
     * Features:
     * - Configurable FPS limits (Battery aware)
     * - WebGL Context Loss / Restore handling
     * - Proper Resource Disposal (prevent memory leaks)
     * - Mouse Parallax
     * - Telemetry Bridge (Niri / QuickShell)
     */

    let scene, camera, renderer;
    let animationId = null;
    let lastRenderTime = 0;
    
    // Performance Profile State
    const CONFIG = {
      targetFPS: 60,
      quality: 'high', // ultra, high, balanced, low, battery_saver
      mouseParallax: true
    };
    
    let isContextLost = false;

    // --- 1. INITIALIZATION ---
    function init() {
      const container = document.getElementById('container');
      
      // Scene setup
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.02);
      
      // Camera setup
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 50;

      // Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Handle Context Loss
      renderer.domElement.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        isContextLost = true;
        cancelAnimationFrame(animationId);
        console.warn("WebGL Context Lost!");
      }, false);

      renderer.domElement.addEventListener("webglcontextrestored", () => {
        isContextLost = false;
        console.log("WebGL Context Restored!");
        initSceneContent();
        renderLoop(performance.now());
      }, false);

      initSceneContent();
      setupBridge();
      setupEvents();
      
      // Start loop
      renderLoop(performance.now());
    }

    // --- 2. SCENE CONTENT (Edit this for custom wallpapers) ---
    let cube;
    function initSceneContent() {
      // Clear old content if restoring
      while(scene.children.length > 0){ 
        scene.remove(scene.children[0]); 
      }
      
      const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
      scene.add(ambientLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // Placeholder Object
      const geometry = new THREE.BoxGeometry(10, 10, 10);
      const material = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
      cube = new THREE.Mesh(geometry, material);
      scene.add(cube);

      // Anime.js Animation Example
      anime({
        targets: cube.rotation,
        y: Math.PI * 2,
        x: Math.PI * 2,
        duration: 8000,
        easing: 'linear',
        loop: true
      });
    }

    // --- 3. RENDER LOOP & FPS THROTTLING ---
    function renderLoop(time) {
      if (isContextLost) return;
      animationId = requestAnimationFrame(renderLoop);

      // Fullscreen Pause Optimization (from QuickShell bridge)
      if (window.__isWallpaperObscured) return;

      // FPS Limiter
      const timeSinceLastRender = time - lastRenderTime;
      const frameInterval = 1000 / CONFIG.targetFPS;
      
      if (timeSinceLastRender < frameInterval) return;
      lastRenderTime = time - (timeSinceLastRender % frameInterval);

      // Apply Mouse Parallax
      if (CONFIG.mouseParallax && !window.__isWallpaperObscured) {
        camera.position.x += (targetMouseX - camera.position.x) * 0.05;
        camera.position.y += (targetMouseY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
      }

      renderer.render(scene, camera);
    }

    // --- 4. EVENTS & PARALLAX ---
    let targetMouseX = 0;
    let targetMouseY = 0;
    function setupEvents() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.addEventListener('mousemove', (e) => {
        const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        // Dampen the magnitude
        targetMouseX = mouseX * 2;
        targetMouseY = mouseY * 2;
      });
      
      // Cleanup on unload to prevent memory leaks when switching themes
      window.addEventListener("unload", disposeResources);
    }

    // --- 5. SYSTEM BRIDGE (QuickShell/Niri) ---
    function setupBridge() {
      if (!window.wallpaper) return;

      // Battery Awareness
      window.wallpaper.on('battery', (data) => {
        if (!data.charging && data.percentage < 30) {
          CONFIG.targetFPS = 30;
          CONFIG.quality = 'battery_saver';
          renderer.setPixelRatio(1); // Drop resolution
        } else {
          CONFIG.targetFPS = 60;
          CONFIG.quality = 'high';
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
      });

      // Telemetry (CPU/RAM)
      window.wallpaper.on('telemetry', (data) => {
        // e.g., if (data.cpu > 80) { reduce particles }
      });
    }

    // --- 6. RESOURCE CLEANUP (CRITICAL) ---
    function disposeResources() {
      cancelAnimationFrame(animationId);
      anime.remove('*'); // Destroy all Anime.js instances

      if (!scene) return;
      scene.traverse((object) => {
        if (!object.isMesh) return;
        
        if (object.geometry) {
          object.geometry.dispose();
        }
        
        if (object.material) {
          if (Array.isArray(object.material)) {
            object.material.forEach(m => disposeMaterial(m));
          } else {
            disposeMaterial(object.material);
          }
        }
      });

      if (renderer) {
        renderer.dispose();
        renderer.forceContextLoss();
      }
    }

    function disposeMaterial(material) {
      Object.keys(material).forEach(prop => {
        if (!material[prop]) return;
        if (material[prop] !== null && typeof material[prop].dispose === 'function') {
          material[prop].dispose();
        }
      });
      material.dispose();
    }

    // Start!
    init();
  </script>
</body>
</html>
