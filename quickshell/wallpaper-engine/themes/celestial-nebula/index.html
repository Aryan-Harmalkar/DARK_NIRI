<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Nebula</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #020010; }
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const W = () => canvas.width;
const H = () => canvas.height;

// Dense starfield with parallax layers
const starLayers = [[], [], []];
const starSpeeds = [0.05, 0.15, 0.4];
for (let layer = 0; layer < 3; layer++) {
  const count = [300, 150, 60][layer];
  for (let i = 0; i < count; i++) {
    starLayers[layer].push({
      x: Math.random() * W(),
      y: Math.random() * H(),
      r: [0.4, 0.8, 1.5][layer] * (Math.random() * 0.8 + 0.6),
      a: Math.random(),
      twinkle: Math.random() * 0.015 + 0.003,
      color: Math.random() > 0.85
        ? `hsl(${Math.random() * 60 + 200}, 80%, 85%)`
        : '#ffffff'
    });
  }
}

// Shooting stars
const shooters = [];
function spawnShooter() {
  shooters.push({
    x: Math.random() * W(),
    y: Math.random() * H() * 0.4,
    len: Math.random() * 80 + 40,
    speed: Math.random() * 12 + 8,
    angle: Math.PI * 0.15 + Math.random() * 0.2,
    alpha: 1,
    decay: Math.random() * 0.015 + 0.008
  });
}

// Nebula cloud particles
const clouds = [];
const nebulaColors = [
  { r: 80, g: 40, b: 180 },   // deep purple
  { r: 30, g: 60, b: 200 },   // blue
  { r: 150, g: 30, b: 120 },  // magenta
  { r: 20, g: 100, b: 180 },  // teal
  { r: 180, g: 50, b: 80 },   // crimson
  { r: 40, g: 150, b: 150 }   // cyan
];
for (let i = 0; i < 18; i++) {
  const c = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
  clouds.push({
    x: Math.random() * W(),
    y: Math.random() * H(),
    r: Math.random() * 250 + 100,
    color: c,
    alpha: Math.random() * 0.06 + 0.02,
    driftX: (Math.random() - 0.5) * 0.15,
    driftY: (Math.random() - 0.5) * 0.08,
    pulseSpeed: Math.random() * 0.003 + 0.001,
    pulsePhase: Math.random() * Math.PI * 2
  });
}

// Cosmic dust
const dust = [];
for (let i = 0; i < 50; i++) {
  dust.push({
    x: Math.random() * W(),
    y: Math.random() * H(),
    r: Math.random() * 2 + 0.5,
    speedX: (Math.random() - 0.5) * 0.3,
    speedY: (Math.random() - 0.5) * 0.2,
    alpha: Math.random() * 0.5 + 0.2,
    hue: Math.random() * 60 + 240
  });
}

let time = 0;
let lastShooter = 0;

function animate() {
  time += 0.016;
  ctx.fillStyle = '#020010';
  ctx.fillRect(0, 0, W(), H());

  // Nebula clouds
  for (const c of clouds) {
    c.x += c.driftX;
    c.y += c.driftY;
    if (c.x < -c.r) c.x = W() + c.r;
    if (c.x > W() + c.r) c.x = -c.r;
    if (c.y < -c.r) c.y = H() + c.r;
    if (c.y > H() + c.r) c.y = -c.r;

    const pulse = 1 + Math.sin(time * c.pulseSpeed * 60 + c.pulsePhase) * 0.3;
    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * pulse);
    grad.addColorStop(0, `rgba(${c.color.r}, ${c.color.g}, ${c.color.b}, ${c.alpha * pulse})`);
    grad.addColorStop(0.4, `rgba(${c.color.r}, ${c.color.g}, ${c.color.b}, ${c.alpha * 0.5})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r * pulse, 0, Math.PI * 2);
    ctx.fill();
  }

  // Stars
  for (let layer = 0; layer < 3; layer++) {
    for (const s of starLayers[layer]) {
      s.x -= starSpeeds[layer];
      if (s.x < -2) s.x = W() + 2;
      s.a += s.twinkle;
      const alpha = 0.3 + Math.sin(s.a) * 0.5;
      ctx.globalAlpha = Math.max(0.05, alpha);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Cosmic dust
  for (const d of dust) {
    d.x += d.speedX;
    d.y += d.speedY;
    if (d.x < 0) d.x = W();
    if (d.x > W()) d.x = 0;
    if (d.y < 0) d.y = H();
    if (d.y > H()) d.y = 0;

    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = `hsl(${d.hue}, 70%, 75%)`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Shooting stars
  if (time - lastShooter > 2 + Math.random() * 4) {
    spawnShooter();
    lastShooter = time;
  }

  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.x += Math.cos(s.angle) * s.speed;
    s.y += Math.sin(s.angle) * s.speed;
    s.alpha -= s.decay;

    if (s.alpha <= 0) {
      shooters.splice(i, 1);
      continue;
    }

    const endX = s.x - Math.cos(s.angle) * s.len;
    const endY = s.y - Math.sin(s.angle) * s.len;

    const grad = ctx.createLinearGradient(s.x, s.y, endX, endY);
    grad.addColorStop(0, `rgba(255, 255, 255, ${s.alpha})`);
    grad.addColorStop(0.3, `rgba(180, 200, 255, ${s.alpha * 0.6})`);
    grad.addColorStop(1, 'transparent');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // Head glow
    ctx.fillStyle = `rgba(200, 220, 255, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
