<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anime Pirate Crew 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #0b1a2e; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="lib/three.min.js"></script>
  <script src="lib/anime.min.js"></script>

  <script>
    let scene, camera, renderer;
    let animationId = null, lastRenderTime = 0;
    const CONFIG = { targetFPS: 60, quality: 'high', mouseParallax: true };
    let isContextLost = false;

    // --- ELEMENTS ---
    let ocean, shipGroup, clouds = [], particles;
    let clock = new THREE.Clock();

    function init() {
      const container = document.getElementById('container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xff9966, 0.002);
      
      scene.background = new THREE.Color(0xff9966); // Sunset orange

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 15, 60);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      renderer.domElement.addEventListener("webglcontextlost", (e) => { e.preventDefault(); isContextLost = true; cancelAnimationFrame(animationId); }, false);
      renderer.domElement.addEventListener("webglcontextrestored", () => { isContextLost = false; initSceneContent(); renderLoop(performance.now()); }, false);

      initSceneContent();
      setupBridge();
      setupEvents();
      renderLoop(performance.now());
    }

    function initSceneContent() {
      while(scene.children.length > 0) { scene.remove(scene.children[0]); }
      
      // LIGHTING
      const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
      scene.add(ambientLight);
      
      const sunLight = new THREE.DirectionalLight(0xff5500, 2);
      sunLight.position.set(-50, 20, -50);
      scene.add(sunLight);

      // SUN
      const sunGeo = new THREE.CircleGeometry(20, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xff4400, fog: false });
      const sun = new THREE.Mesh(sunGeo, sunMat);
      sun.position.set(-100, 10, -200);
      scene.add(sun);

      // OCEAN
      const oceanGeo = new THREE.PlaneGeometry(500, 500, 40, 40);
      // Create toon-like water
      const oceanMat = new THREE.MeshPhongMaterial({ color: 0x0066aa, flatShading: true, shininess: 100 });
      ocean = new THREE.Mesh(oceanGeo, oceanMat);
      ocean.rotation.x = -Math.PI / 2;
      ocean.position.y = -5;
      scene.add(ocean);

      // SHIP
      shipGroup = new THREE.Group();
      
      const hullGeo = new THREE.BoxGeometry(20, 8, 40);
      const hullMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 }); // Brown wood
      const hull = new THREE.Mesh(hullGeo, hullMat);
      hull.position.y = 4;
      shipGroup.add(hull);

      const mastGeo = new THREE.CylinderGeometry(0.5, 0.5, 30);
      const mastMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f });
      const mast = new THREE.Mesh(mastGeo, mastMat);
      mast.position.set(0, 20, 5);
      shipGroup.add(mast);

      const sailGeo = new THREE.PlaneGeometry(15, 20);
      const sailMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, side: THREE.DoubleSide });
      const sail = new THREE.Mesh(sailGeo, sailMat);
      sail.position.set(0, 20, 6);
      shipGroup.add(sail);

      // ABSTRACT CREW (Pill shapes with distinct colors)
      const crewColors = [0xff0000, 0x00ff00, 0xffa500, 0x0000ff]; // Luffy, Zoro, Nami, Sanji style hints
      const crewOffsets = [[0,8,15], [3,8,12], [-3,8,10], [0,8,-5]];
      crewColors.forEach((color, i) => {
        const charGeo = new THREE.CylinderGeometry(0.8, 0.8, 3, 8);
        const charMat = new THREE.MeshStandardMaterial({ color: color });
        const character = new THREE.Mesh(charGeo, charMat);
        character.position.set(...crewOffsets[i]);
        shipGroup.add(character);
        
        // Idle animation for characters (breathing)
        anime({
          targets: character.scale,
          y: [1, 1.05],
          duration: 1500 + Math.random() * 500,
          direction: 'alternate',
          loop: true,
          easing: 'easeInOutSine'
        });
      });

      scene.add(shipGroup);

      // Ship gentle bobbing (Idle animation)
      anime({
        targets: shipGroup.rotation,
        z: [ -0.05, 0.05 ],
        x: [ -0.02, 0.02 ],
        duration: 3000,
        direction: 'alternate',
        loop: true,
        easing: 'easeInOutSine'
      });
      anime({
        targets: shipGroup.position,
        y: [ -0.5, 0.5 ],
        duration: 2000,
        direction: 'alternate',
        loop: true,
        easing: 'easeInOutSine'
      });

      // CLOUDS
      const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffddcc, flatShading: true });
      for(let i=0; i<8; i++) {
        const cloudGeo = new THREE.DodecahedronGeometry(Math.random() * 5 + 5);
        const cloud = new THREE.Mesh(cloudGeo, cloudMat);
        cloud.position.set((Math.random() - 0.5) * 200, 20 + Math.random() * 20, -100 - Math.random() * 100);
        scene.add(cloud);
        clouds.push(cloud);
      }

      // PARTICLES (Sea Spray / Atmosphere)
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(300 * 3);
      for(let i=0; i<300*3; i+=3) {
        pPos[i] = (Math.random() - 0.5) * 100;
        pPos[i+1] = Math.random() * 30;
        pPos[i+2] = (Math.random() - 0.5) * 100;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.6 });
      particles = new THREE.Points(pGeo, pMat);
      scene.add(particles);
    }

    // --- RENDER LOOP ---
    let targetMouseX = 0, targetMouseY = 0;
    
    function renderLoop(time) {
      if (isContextLost) return;
      animationId = requestAnimationFrame(renderLoop);

      if (window.__isWallpaperObscured) return;

      const timeSinceLastRender = time - lastRenderTime;
      const frameInterval = 1000 / CONFIG.targetFPS;
      if (timeSinceLastRender < frameInterval) return;
      lastRenderTime = time - (timeSinceLastRender % frameInterval);

      const delta = clock.getDelta();
      const el = clock.getElapsedTime();

      // Animate Ocean Waves (Vertex displacement)
      if (ocean) {
        const positions = ocean.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
          const vx = positions.getX(i);
          const vy = positions.getY(i);
          // Sine wave based on x and y position + time
          const z = Math.sin(vx * 0.1 + el * 2) * Math.cos(vy * 0.1 + el) * 1.5;
          positions.setZ(i, z);
        }
        ocean.geometry.attributes.position.needsUpdate = true;
      }

      // Animate Clouds
      clouds.forEach(cloud => {
        cloud.position.x += 0.05;
        if (cloud.position.x > 150) cloud.position.x = -150;
      });

      // Animate Particles
      if (particles) {
        particles.rotation.y += 0.001;
      }

      // Mouse Parallax
      if (CONFIG.mouseParallax && !window.__isWallpaperObscured) {
        camera.position.x += (targetMouseX - camera.position.x) * 0.05;
        camera.position.y += ((15 + targetMouseY) - camera.position.y) * 0.05;
        camera.lookAt(0, 5, 0);
      }

      renderer.render(scene, camera);
    }

    function setupEvents() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth * 2 - 1) * 5;
        targetMouseY = -(e.clientY / window.innerHeight * 2 - 1) * 3;
      });
      
      window.addEventListener("unload", disposeResources);
    }

    function setupBridge() {
      if (!window.wallpaper) return;
      window.wallpaper.on('battery', (data) => {
        if (!data.charging && data.percentage < 30) {
          CONFIG.targetFPS = 30; renderer.setPixelRatio(1);
        } else {
          CONFIG.targetFPS = 60; renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
      });
    }

    function disposeResources() {
      cancelAnimationFrame(animationId);
      anime.remove('*');
      if (!scene) return;
      scene.traverse((object) => {
        if (!object.isMesh) return;
        if (object.geometry) object.geometry.dispose();
        if (object.material) {
          if (Array.isArray(object.material)) object.material.forEach(m => m.dispose());
          else object.material.dispose();
        }
      });
      if (renderer) { renderer.dispose(); renderer.forceContextLoss(); }
    }

    init();
  </script>
</body>
</html>
