<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Piece 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #0b3954; font-family: sans-serif; }
    #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 40px;
    }
    .top-bar { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.8); }
    .bottom-bar { text-align: left; color: rgba(255, 255, 255, 0.9); }
    h1 { font-size: 4rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { font-size: 1.5rem; font-weight: normal; color: #ffb703; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .stats { margin-top: 20px; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="ui-layer">
    <div class="top-bar">
      <div>GRAND LINE</div>
      <div id="clock">12:00</div>
    </div>
    <div class="bottom-bar">
      <h1 id="char-name">THOUSAND SUNNY</h1>
      <h2 id="char-epithet">KING OF THE BEASTS</h2>
      <div class="stats">BOUNTY: ฿ 3,000,000,000</div>
    </div>
  </div>

  <script src="../shared/lib/three.min.js"></script>
  <script src="../shared/lib/anime.min.js"></script>
  <script src="../shared/engine-core.js"></script>
  <script src="theme.js"></script>
</body>
</html>
