<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Sakura</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0a1a; }
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

/* Skyline silhouette */
.skyline {
  position: fixed; bottom: 0; left: 0; width: 100%; height: 35%;
  background: linear-gradient(0deg, #0a0612 0%, #1a0f2e 40%, transparent 100%);
  z-index: 2;
}
.skyline::before {
  content: '';
  position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
  background:
    /* buildings silhouette */
    linear-gradient(0deg, #0a0612 0%, #0a0612 60%, transparent 60%) 5% 100% / 8% 55% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 70%, transparent 70%) 15% 100% / 5% 70% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 80%, transparent 80%) 22% 100% / 10% 80% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 65%, transparent 65%) 35% 100% / 7% 65% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 75%, transparent 75%) 45% 100% / 12% 90% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 60%, transparent 60%) 60% 100% / 6% 50% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 70%, transparent 70%) 68% 100% / 9% 75% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 85%, transparent 85%) 80% 100% / 8% 85% no-repeat,
    linear-gradient(0deg, #0a0612 0%, #0a0612 55%, transparent 55%) 92% 100% / 6% 45% no-repeat;
}

/* Warm glow at horizon */
.horizon-glow {
  position: fixed; bottom: 20%; left: 0; width: 100%; height: 30%;
  background: radial-gradient(ellipse 120% 60% at 50% 100%, rgba(255, 120, 80, 0.15) 0%, transparent 70%);
  z-index: 1;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="horizon-glow"></div>
<div class="skyline"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Stars
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height * 0.65,
    r: Math.random() * 1.5 + 0.3,
    a: Math.random(),
    twinkleSpeed: Math.random() * 0.02 + 0.005
  });
}

// Sakura petals
const petals = [];
const petalColors = ['#ffb7c5', '#ff9eb5', '#ffc4d6', '#ffa8c0', '#ff85a2'];
for (let i = 0; i < 80; i++) {
  petals.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    size: Math.random() * 8 + 4,
    speedY: Math.random() * 1.2 + 0.3,
    speedX: Math.random() * 0.8 - 0.2,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    sway: Math.random() * 2 + 1,
    swayOffset: Math.random() * Math.PI * 2,
    color: petalColors[Math.floor(Math.random() * petalColors.length)],
    alpha: Math.random() * 0.5 + 0.5
  });
}

let time = 0;

function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, p.size * 0.6, p.size, 0, 0, Math.PI * 2);
  ctx.fill();
  // Inner highlight
  ctx.globalAlpha = p.alpha * 0.4;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-p.size * 0.15, -p.size * 0.2, p.size * 0.2, p.size * 0.4, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0d0a2a');
  grad.addColorStop(0.3, '#1a1040');
  grad.addColorStop(0.5, '#2d1854');
  grad.addColorStop(0.65, '#4a2060');
  grad.addColorStop(0.8, '#8a3050');
  grad.addColorStop(1.0, '#c45030');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function animate() {
  time += 0.01;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Sky gradient
  drawSky();

  // Stars
  ctx.globalAlpha = 1;
  for (const s of stars) {
    s.a += s.twinkleSpeed;
    const alpha = 0.3 + Math.sin(s.a) * 0.5;
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Sakura petals
  for (const p of petals) {
    p.y += p.speedY;
    p.x += p.speedX + Math.sin(time * p.sway + p.swayOffset) * 0.5;
    p.rotation += p.rotSpeed;

    if (p.y > canvas.height + 20) {
      p.y = -20;
      p.x = Math.random() * canvas.width;
    }
    if (p.x > canvas.width + 20) p.x = -20;
    if (p.x < -20) p.x = canvas.width + 20;

    drawPetal(p);
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
