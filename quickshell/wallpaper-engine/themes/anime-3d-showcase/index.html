<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anime 3D Parallax Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Anime HUD Overlay */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 60px;
    }
    
    .anime-title {
      font-size: 80px; font-weight: 900; color: #fff;
      text-transform: uppercase; letter-spacing: 15px;
      text-shadow: 0 0 20px rgba(255,42,109,0.8), 4px 4px 0px #01ffc3;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      opacity: 0; /* Animated by Anime.js */
      transform: translateX(-50px);
    }

    .anime-subtitle {
      font-size: 24px; color: #01ffc3; letter-spacing: 8px; margin-top: 10px;
      text-shadow: 0 0 10px rgba(1,255,195,0.5);
      background: rgba(0,0,0,0.5); padding: 5px 20px; border-left: 5px solid #ff2a6d;
      opacity: 0;
      transform: translateX(-30px);
    }
    
    #stats-box {
      position: absolute; bottom: 50px; right: 50px;
      display: flex; gap: 30px; background: rgba(10,5,25,0.6);
      padding: 20px 40px; border: 1px solid rgba(255,42,109,0.4);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(30px);
    }

    .stat { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: 12px; color: #ff2a6d; letter-spacing: 2px; }
    .stat-val { font-size: 32px; font-weight: bold; color: #fff; }
    
  </style>
</head>
<body>

  <div id="hud">
    <div class="anime-title" id="main-title">STRAY CAT</div>
    <div class="anime-subtitle" id="sub-title">NIRI WORKSPACE: <span id="ws-indicator">01</span></div>
  </div>

  <div id="stats-box">
    <div class="stat">
      <div class="stat-label">CPU LOAD</div>
      <div class="stat-val" id="cpu-val">0%</div>
    </div>
    <div class="stat">
      <div class="stat-label">RAM ALLOC</div>
      <div class="stat-val" id="ram-val">0%</div>
    </div>
  </div>

  <!-- Local Libraries -->
  <script src="lib/three.min.js"></script>
  <script src="lib/anime.min.js"></script>
  
  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 100;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- 2. 2D ANIME WALLPAPER PARALLAX PLANE ---
    // Load the massive anime wallpaper image
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load('bg.png', (texture) => {
      // Calculate aspect ratio to fit the screen while covering it
      const imgAspect = texture.image.width / texture.image.height;
      const screenAspect = window.innerWidth / window.innerHeight;
      
      let planeWidth = 220; // Make it larger than viewport for parallax panning
      let planeHeight = 220 / imgAspect;
      
      if (planeHeight < 150) {
        planeHeight = 150;
        planeWidth = 150 * imgAspect;
      }
      
      const planeGeo = new THREE.PlaneGeometry(planeWidth, planeHeight);
      const planeMat = new THREE.MeshBasicMaterial({ map: texture, depthWrite: false });
      const bgPlane = new THREE.Mesh(planeGeo, planeMat);
      bgPlane.position.z = -50;
      scene.add(bgPlane);
    });

    // --- 3. 3D FLOATING PARTICLES (Sakura / Dust) ---
    const particleCount = 600;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    const pVel = []; // Velocities for Anime.js / render loop
    
    for(let i = 0; i < particleCount; i++) {
      // Spread across x, y, and z (between camera and background)
      pPos[i*3] = (Math.random() - 0.5) * 200;
      pPos[i*3+1] = (Math.random() - 0.5) * 150;
      pPos[i*3+2] = (Math.random() - 0.5) * 100 + 20; // 3D depth in front of BG
      
      pVel.push({
        y: - (Math.random() * 0.1 + 0.05), // Falling down
        x: (Math.random() - 0.5) * 0.05,
        rot: Math.random() * 0.02
      });
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    
    // Create a circular gradient texture programmatically for glowing particles
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.2, 'rgba(255,42,109,0.8)');
    grad.addColorStop(1, 'rgba(255,42,109,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const particleTexture = new THREE.CanvasTexture(canvas);
    
    const pMat = new THREE.PointsMaterial({
      size: 2.5,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // --- 4. ANIME.JS CHOREOGRAPHY ---
    // UI Entrance Animation
    anime.timeline({ easing: 'easeOutExpo' })
      .add({ targets: '#main-title', opacity: 1, translateX: 0, duration: 1500, delay: 500 })
      .add({ targets: '#sub-title', opacity: 1, translateX: 0, duration: 1000 }, '-=1000')
      .add({ targets: '#stats-box', opacity: 1, translateY: 0, duration: 1200 }, '-=800');

    // Make the title "breathe" continuously
    anime({
      targets: '#main-title',
      scale: [1, 1.02],
      duration: 3000,
      direction: 'alternate',
      loop: true,
      easing: 'easeInOutSine'
    });

    // --- 5. NIRI BRIDGE (Workspace Parallax & Telemetry) ---
    let targetCamX = 0;
    let targetCamY = 0;
    
    if (window.wallpaper) {
      window.wallpaper.on('workspace', (ws) => {
        if (!ws) return;
        document.getElementById('ws-indicator').innerText = String(ws.idx).padStart(2, '0');
        
        // Pan the 3D camera across the 2D image plane to create immense parallax depth!
        // Workspace 1 = Left, Workspace 2 = Center, Workspace 3 = Right
        const panAmount = (ws.idx - 2) * 15; 
        
        anime({
          targets: camera.position,
          x: panAmount,
          duration: 1200,
          easing: 'easeOutElastic(1, .9)'
        });
        
        // Subtle rotation for 3D feel
        anime({
          targets: camera.rotation,
          y: -panAmount * 0.005,
          duration: 1200,
          easing: 'easeOutQuad'
        });
        
        // UI Glitch effect on switch
        anime({
          targets: '#main-title',
          skewX: [20, -10, 0],
          opacity: [0.5, 1],
          duration: 400,
          easing: 'easeOutQuad'
        });
      });
      
      window.wallpaper.on('telemetry', (data) => {
        if (data.cpu !== undefined) document.getElementById('cpu-val').innerText = data.cpu + '%';
        if (data.memory !== undefined) document.getElementById('ram-val').innerText = data.memory + '%';
        
        // Speed up particles if CPU is high
        if (data.cpu > 50) {
          particles.material.color.setHex(0x01ffc3); // Turn cyan
        } else {
          particles.material.color.setHex(0xffffff); // Normal pinkish/white
        }
      });
    }

    // --- 6. MOUSE PARALLAX ---
    document.addEventListener('mousemove', (e) => {
      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      
      targetCamX = mouseX * 5;
      targetCamY = mouseY * 5;
    });

    // --- 7. RENDER LOOP ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animateLoop() {
      if (window.__isWallpaperObscured) {
        requestAnimationFrame(animateLoop);
        return;
      }
      
      // Update Particles
      const positions = pGeo.attributes.position.array;
      for(let i=0; i < particleCount; i++) {
        positions[i*3+1] += pVel[i].y;
        positions[i*3] += pVel[i].x;
        
        // Reset if they fall out of bounds
        if (positions[i*3+1] < -100) {
          positions[i*3+1] = 100;
          positions[i*3] = (Math.random() - 0.5) * 200;
        }
      }
      pGeo.attributes.position.needsUpdate = true;
      
      // Smoothly interpolate camera for mouse parallax (stacked with workspace panning)
      // camera.position.x += (targetCamX - camera.position.x) * 0.05; // disabled to not clash with workspace tween
      camera.position.y += (targetCamY - camera.position.y) * 0.05;
      
      renderer.render(scene, camera);
      requestAnimationFrame(animateLoop);
    }
    animateLoop();
  </script>
</body>
</html>
